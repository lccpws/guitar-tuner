<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>调弦 · 吉他调音器</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=DM+Mono:wght@300;400;500&display=swap');

:root{
  --bg:        #232323;
  --panel:     #2b2b2b;
  --ink:       #f5f5f5;
  --mut:       #9a9a9a;
  --faint:     #666;
  --line:      rgba(255,255,255,.09);
  --green:     #8fe04d;
  --green-deep:#5cab2e;
  --amber:     #e3a44b;
  --red:       #e07856;
  --wood1:     #6b4226;
  --wood2:     #3a2110;
  --display:   "Fraunces","Noto Serif SC","Songti SC",serif;
  --mono:      "DM Mono","SF Mono",monospace;
  --body:      -apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
}

*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ height:100%; }

body{
  font-family:var(--body);
  background:
    radial-gradient(120% 60% at 50% 0%, #2a2a2a 0%, var(--bg) 60%, #1d1d1d 100%);
  color:var(--ink);
  min-height:100dvh;
  display:flex; flex-direction:column;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}

.wrap{
  width:min(560px,100%);
  margin:0 auto;
  padding:clamp(16px,3.5vw,28px) 22px calc(24px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; flex:1;
}

/* ── 页眉 ─────────────────────── */
header{
  display:flex; align-items:center; justify-content:space-between;
  padding-bottom:12px; border-bottom:1px solid var(--line);
}
.brand{ display:flex; align-items:baseline; gap:10px; }
.brand h1{ font-family:var(--display); font-weight:500; font-size:20px; letter-spacing:.06em; }
.brand .en{
  font-family:var(--mono); font-size:10px; font-weight:300;
  color:var(--faint); letter-spacing:.26em; text-transform:uppercase;
}
#autoBtn{
  appearance:none; cursor:pointer;
  font-family:var(--mono); font-size:11px; letter-spacing:.08em;
  color:var(--mut); background:none;
  border:1px solid var(--line); border-radius:999px; padding:5px 13px;
  transition:all .25s;
}
#autoBtn.on{ color:var(--green); border-color:rgba(143,224,77,.45); }
#autoBtn .dot{
  display:inline-block; width:6px; height:6px; border-radius:50%;
  background:var(--faint); margin-right:7px; vertical-align:1px;
  transition:all .25s;
}
#autoBtn.on .dot{ background:var(--green); box-shadow:0 0 7px rgba(143,224,77,.8); }

/* ── 频率显示 ─────────────────────── */
.stage{ display:flex; flex-direction:column; align-items:center; }

.freq-display{
  margin-top:clamp(12px,3vh,26px);
  font-family:var(--mono); font-weight:300;
  display:flex; align-items:baseline; gap:8px;
  transition:color .2s;
}
.freq-display .num{
  font-size:clamp(42px,12vw,60px); line-height:1;
  letter-spacing:-.02em; min-width:2.6em; text-align:center;
}
.freq-display .unit{ font-size:16px; color:var(--mut); }
.freq-display.ok .num{ color:var(--green); }

.target{
  margin-top:10px;
  font-family:var(--mono); font-size:13px; font-weight:300;
  color:var(--mut); letter-spacing:.05em; min-height:18px;
}

/* ── 标志线标尺 ─────────────────────── */
.ruler{
  position:relative;
  width:min(400px,100%);
  height:96px;
  margin-top:20px;
}
.ruler .track{
  position:absolute; left:0; right:0; top:62px; height:2px;
  background:rgba(255,255,255,.13); border-radius:1px;
}
.tick{
  position:absolute; width:1px; background:rgba(255,255,255,.22);
  top:58px; height:10px;
}
.tick.major{ top:54px; height:18px; background:rgba(255,255,255,.4); }
.refline{
  position:absolute; left:50%; top:48px; height:30px; width:2px;
  margin-left:-1px; background:#fff; border-radius:1px;
  box-shadow:0 0 6px rgba(255,255,255,.5);
}
.refline::after{ /* 中心三角 */
  content:""; position:absolute; left:50%; bottom:-7px;
  transform:translateX(-50%);
  border:5px solid transparent; border-top-color:#fff;
}
.marker{
  position:absolute; top:0; left:50%; width:0;
  transition:left .12s linear;
}
.marker .stem{
  position:absolute; left:-1.5px; top:44px; width:3px; height:34px;
  background:var(--green); border-radius:2px;
  box-shadow:0 0 9px rgba(143,224,77,.55);
}
.marker .bubble{
  position:absolute; left:-21px; top:-6px;
  width:42px; height:42px; border-radius:50%;
  background:#333; border:1.5px solid var(--green);
  color:var(--ink);
  font-family:var(--mono); font-size:15px; font-weight:500;
  display:flex; align-items:center; justify-content:center;
  transition:background .2s, color .2s, box-shadow .2s;
}
.marker .bubble.ok{
  background:var(--green); color:#151515;
  box-shadow:0 0 16px rgba(143,224,77,.6);
}
.ruler-labels{
  width:min(400px,100%);
  display:flex; justify-content:space-between;
  margin-top:2px;
  font-family:var(--mono); font-size:11px; color:var(--faint);
}

/* ── 音符刻度条 ─────────────────────── */
.notes{
  display:flex; justify-content:center; align-items:baseline;
  gap:clamp(16px,7vw,40px);
  margin-top:14px; min-height:40px;
}
.nt{
  font-family:var(--display); font-weight:300;
  color:var(--faint); font-size:19px;
  width:2.4em; text-align:center;
  transition:color .25s, font-size .25s;
}
.nt sub{ font-size:.55em; vertical-align:baseline; margin-left:1px; }
.nt.cur{
  color:#fff; font-size:36px; font-weight:500;
}

/* ── 状态 ─────────────────────── */
.status{
  margin-top:12px; min-height:20px;
  font-family:var(--mono); font-size:14px; letter-spacing:.12em;
  color:var(--mut); transition:color .2s;
}
.status.ok{ color:var(--green); }
.status.low{ color:var(--amber); }
.status.high{ color:var(--red); }

.lvl{
  width:150px; height:3px; border-radius:2px; margin-top:10px;
  background:rgba(255,255,255,.1); overflow:hidden;
}
.lvl i{
  display:block; height:100%; width:0%;
  background:var(--green); border-radius:2px;
  transition:width .1s linear;
}

/* ── 琴头选弦区 ─────────────────────── */
.head{
  display:grid;
  grid-template-columns:58px 1fr 58px;
  gap:10px;
  margin-top:auto; padding-top:14px;
}
.pcol{ display:flex; flex-direction:column; justify-content:space-around; }
.pbtn{
  appearance:none; cursor:pointer;
  width:52px; height:52px; border-radius:50%;
  border:1.5px solid rgba(255,255,255,.3);
  background:transparent; color:#c9c9c9;
  font-family:var(--display); font-size:19px; font-weight:400;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  line-height:1; transition:all .2s;
}
.pbtn sub{ font-size:10px; margin-top:2px; opacity:.75; }
@media (hover:hover){
  .pbtn:not(.active):hover{ border-color:rgba(255,255,255,.6); color:#fff; }
}
.pbtn.active{
  background:#fff; color:#161616; border-color:#fff;
  box-shadow:0 0 14px rgba(255,255,255,.3);
}
.neck{ width:100%; display:block; }
.strline{ transition:stroke .25s; }
.strline.on{ stroke:var(--green); filter:drop-shadow(0 0 3px rgba(143,224,77,.8)); }

footer{
  text-align:center; padding-top:12px;
  font-size:11px; color:var(--faint); letter-spacing:.06em;
}

/* ── 启动遮罩 ─────────────────────── */
#gate{
  position:fixed; inset:0; z-index:10;
  background:rgba(20,20,20,.94); backdrop-filter:blur(6px);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:22px; padding:32px; text-align:center;
  transition:opacity .5s;
}
#gate.hide{ opacity:0; pointer-events:none; }
#gate .g-wire{ width:110px; height:3px; border-radius:2px;
  background:linear-gradient(180deg,#9a8a70,#4a3f30); }
#gate h2{ font-family:var(--display); font-weight:500; font-size:30px; }
#gate p{ color:var(--mut); font-size:14px; line-height:1.8; max-width:300px; }
#startBtn{
  appearance:none; cursor:pointer;
  font-family:var(--body); font-size:16px; letter-spacing:.2em;
  color:#161616; background:var(--green);
  border:none; border-radius:999px; padding:15px 52px;
  box-shadow:0 6px 28px rgba(143,224,77,.3);
  transition:transform .15s;
}
#startBtn:active{ transform:scale(.96); }
#gate .err{ color:var(--red); font-size:13px; min-height:18px; }

button:focus-visible{ outline:2px solid var(--green); outline-offset:3px; }

@media (max-width:400px){
  .pbtn{ width:46px; height:46px; font-size:17px; }
  .head{ grid-template-columns:50px 1fr 50px; }
}

@media (prefers-reduced-motion:reduce){
  *{ transition:none !important; animation:none !important; }
}
</style>
</head>
<body>

<div id="gate">
  <div class="g-wire"></div>
  <h2>调弦</h2>
  <p>标准定弦 · E A D G B E<br>点击开启麦克风，然后拨响一根琴弦。</p>
  <button id="startBtn">开启麦克风</button>
  <div class="err" id="gateErr"></div>
</div>

<div class="wrap">
  <header>
    <div class="brand">
      <h1>调弦</h1>
      <span class="en">Guitar Tuner</span>
    </div>
    <button id="autoBtn" class="on"><span class="dot"></span>自动识别</button>
  </header>

  <div class="stage">
    <div class="freq-display" id="freqBox">
      <span class="num" id="freqVal">--</span><span class="unit">Hz</span>
    </div>
    <div class="target" id="targetLine">自动识别 · 拨响任意一根弦</div>

    <div class="ruler" id="ruler">
      <div class="track"></div>
      <div class="refline"></div>
      <div class="marker" id="marker">
        <div class="bubble" id="bubble">–</div>
        <div class="stem"></div>
      </div>
    </div>
    <div class="ruler-labels"><span>♭ 50¢</span><span>0</span><span>♯ 50¢</span></div>

    <div class="notes" id="notes"></div>

    <div class="status" id="status">拨响任意一根弦</div>
    <div class="lvl"><i id="lvlBar"></i></div>
  </div>

  <div class="head">
    <div class="pcol" id="pegLeft"></div>
    <svg class="neck" viewBox="0 0 120 210" aria-hidden="true">
      <defs>
        <linearGradient id="woodG" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#3a2110"/>
          <stop offset=".5" stop-color="#6b4226"/>
          <stop offset="1" stop-color="#3a2110"/>
        </linearGradient>
      </defs>
      <path d="M 31 14 L 89 14 L 95 210 L 25 210 Z" fill="url(#woodG)"/>
      <rect x="18" y="8" width="84" height="6" rx="3" fill="#ded6c4"/>
      <line x1="33" y1="80" x2="87" y2="80" stroke="rgba(255,255,255,.14)" stroke-width="1.5"/>
      <line x1="34" y1="145" x2="86" y2="145" stroke="rgba(255,255,255,.14)" stroke-width="1.5"/>
      <g id="strlines"></g>
    </svg>
    <div class="pcol" id="pegRight"></div>
  </div>

  <footer>建议在安静环境中使用 · 手机与吉他保持 30–50 cm</footer>
</div>

<script>
"use strict";

/* ── 常量 ─────────────────────────── */
const STRINGS = [
  { note:"E", oct:2, hz:82.41  },
  { note:"A", oct:2, hz:110.00 },
  { note:"D", oct:3, hz:146.83 },
  { note:"G", oct:3, hz:196.00 },
  { note:"B", oct:3, hz:246.94 },
  { note:"E", oct:4, hz:329.63 },
];
const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const RANGE = 50;        // 标尺满量程音分
const OK_CENTS = 3;      // 判定"准了"的容差
const NS = "http://www.w3.org/2000/svg";

/* ── DOM ─────────────────────────── */
const $ = id => document.getElementById(id);
const freqBox = $("freqBox"), freqVal = $("freqVal"), targetLine = $("targetLine");
const rulerEl = $("ruler"), markerEl = $("marker"), bubbleEl = $("bubble");
const notesEl = $("notes"), statusEl = $("status"), lvlBar = $("lvlBar");
const autoBtn = $("autoBtn"), gate = $("gate"), startBtn = $("startBtn"), gateErr = $("gateErr");
const pegLeft = $("pegLeft"), pegRight = $("pegRight"), strlinesG = $("strlines");

/* ── 状态 ─────────────────────────── */
let audioCtx = null, analyser = null, buf = null;
let autoMode = true, activeIdx = -1;
let smoothCents = null;      // 指针平滑值（音分）
let dispFreq = null;         // 频率数字平滑值
let hist = [];               // 近期被接受的帧频（中值滤波窗口）
let devCount = 0;            // 连续大幅偏移帧计数
let tunedLock = false;       // "准了"吸附锁（迟滞）
let autoCand = null;         // 自动选弦候选（防抖）
let lastSignal = 0;
const pegBtns = [];

/* ── 标尺刻度 ─────────────────────── */
for (let c = -RANGE; c <= RANGE; c += 5){
  const t = document.createElement("div");
  t.className = "tick" + (c % 25 === 0 ? " major" : "");
  t.style.left = (50 + c / RANGE * 50) + "%";
  rulerEl.appendChild(t);
}

/* ── 琴头：弦线 + 选弦按钮 ───────────── */
const STR_W = [3.5, 3, 2.5, 2, 1.6, 1.2];   // 低音弦粗 → 高音弦细
STRINGS.forEach((s, i) => {
  const x = 27 + i * 13;
  const ln = document.createElementNS(NS, "line");
  ln.setAttribute("x1", x); ln.setAttribute("y1", 12);
  ln.setAttribute("x2", x); ln.setAttribute("y2", 210);
  ln.setAttribute("stroke", "#cfc6b4");
  ln.setAttribute("stroke-width", STR_W[i]);
  ln.setAttribute("stroke-linecap", "round");
  ln.setAttribute("class", "strline");
  ln.dataset.i = i;
  strlinesG.appendChild(ln);
});

function makePegBtn(i){
  const s = STRINGS[i];
  const b = document.createElement("button");
  b.className = "pbtn";
  b.innerHTML = `${s.note}<sub>${s.oct}</sub>`;
  b.setAttribute("aria-label", `${s.note}${s.oct} 弦`);
  b.addEventListener("click", () => {
    autoMode = false;
    autoBtn.classList.remove("on");
    setActive(i);
  });
  pegBtns[i] = b;
  return b;
}
/* 左列 D A E（上→下），右列 G B E —— 与真实琴头一致 */
[2, 1, 0].forEach(i => pegLeft.appendChild(makePegBtn(i)));
[3, 4, 5].forEach(i => pegRight.appendChild(makePegBtn(i)));

autoBtn.addEventListener("click", () => {
  autoMode = true;
  autoBtn.classList.add("on");
  setActive(-1);
});

/* ── 音名工具 ─────────────────────── */
function noteNum(hz){ return Math.round(69 + 12 * Math.log2(hz / 440)); }
function noteLabel(n){
  return { name: NOTE_NAMES[((n % 12) + 12) % 12], oct: Math.floor(n / 12) - 1 };
}

/* ── 选中琴弦 → 更新静态区 ───────────── */
function setActive(i){
  if (i !== activeIdx){
    smoothCents = null;
    dispFreq = null;
    tunedLock = false;
    hist = [];
    devCount = 0;
  }
  activeIdx = i;
  pegBtns.forEach((b, k) => b.classList.toggle("active", k === i));
  [...strlinesG.children].forEach(l =>
    l.classList.toggle("on", Number(l.dataset.i) === i));

  if (i < 0){
    targetLine.textContent = "自动识别 · 拨响任意一根弦";
    notesEl.innerHTML = "";
    return;
  }
  const s = STRINGS[i];
  targetLine.textContent = `${s.note}${s.oct} 弦 · 目标 ${s.hz.toFixed(2)} Hz`;
  const n = noteNum(s.hz);
  notesEl.innerHTML = "";
  for (let k = -2; k <= 2; k++){
    const { name, oct } = noteLabel(n + k);
    const el = document.createElement("span");
    el.className = "nt" + (k === 0 ? " cur" : "");
    el.innerHTML = `${name}<sub>${oct}</sub>`;
    notesEl.appendChild(el);
  }
}

/* ── 启动麦克风 ───────────────────── */
startBtn.addEventListener("click", async () => {
  gateErr.textContent = "";
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    await audioCtx.resume();
    const src = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    src.connect(analyser);
    buf = new Float32Array(analyser.fftSize);
    gate.classList.add("hide");
    loop();
  } catch (e) {
    gateErr.textContent = e.name === "NotAllowedError"
      ? "麦克风权限被拒绝，请在浏览器设置中允许后重试。"
      : "无法访问麦克风：" + (e.message || e.name);
  }
});

/* ── 基频检测：自相关法 ─────────────── */
function autoCorrelate(buf, sampleRate){
  const N = buf.length;
  let rms = 0;
  for (let i = 0; i < N; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / N);
  if (rms < 0.008) return { rms, freq: -1 };

  let r1 = 0, r2 = N - 1;
  const thres = 0.2;
  for (let i = 0; i < N / 2; i++) if (Math.abs(buf[i]) < thres){ r1 = i; break; }
  for (let i = 1; i < N / 2; i++) if (Math.abs(buf[N - i]) < thres){ r2 = N - i; break; }
  const b = buf.slice(r1, r2), n = b.length;
  if (n < 512) return { rms, freq: -1 };

  const minLag = Math.max(2, Math.floor(sampleRate / 700));
  const maxLag = Math.min(n - 1, Math.ceil(sampleRate / 70));
  if (maxLag <= minLag) return { rms, freq: -1 };

  const c = new Float32Array(maxLag + 2);
  let d = 0;
  for (let i = 0; i < n; i++) d += b[i] * b[i];
  c[0] = d / n;
  let maxC = 0;
  for (let lag = minLag; lag <= maxLag; lag++){
    let s = 0;
    for (let i = 0; i < n - lag; i++) s += b[i] * b[i + lag];
    c[lag] = s / (n - lag);
    if (c[lag] > maxC) maxC = c[lag];
  }
  if (maxC <= c[0] * 0.3) return { rms, freq: -1 };

  let best = -1;
  for (let lag = minLag; lag <= maxLag; lag++){
    if (c[lag] > 0.85 * maxC &&
        c[lag] >= c[lag - 1] && c[lag] >= c[lag + 1]){
      best = lag; break;
    }
  }
  if (best < 0){ best = minLag; while (best < maxLag && c[best + 1] > c[best]) best++; }
  if (best <= 0) return { rms, freq: -1 };

  const y1 = c[best - 1] || 0, y2 = c[best], y3 = c[best + 1] || 0;
  const shift = (y3 - y1) / (2 * (2 * y2 - y1 - y3) || 1);
  let freq = sampleRate / (best + shift);

  if (freq < 70 || freq > 700) return { rms, freq: -1 };
  return { rms, freq };
}

/* ── 帧频接受：八度折叠 + 野值剔除 ───────── */
function acceptFreq(f){
  if (hist.length){
    const prev = hist[hist.length - 1];
    /* 把 ×2 / ÷2 的八度误检折回上一帧所在八度 */
    while (f > prev * 1.45) f /= 2;
    while (f < prev * 0.69) f *= 2;
    const dc = Math.abs(1200 * Math.log2(f / prev));
    if (dc > 60){
      /* 单帧大幅跳变多为噪声，忽略；连续 3 帧才视为换了新弦重新锁定 */
      if (++devCount < 3) return;
      hist = [];
      devCount = 0;
    } else {
      devCount = 0;
    }
  }
  hist.push(f);
  if (hist.length > 9) hist.shift();
}

function median(arr){
  const s = [...arr].sort((a, b) => a - b);
  return s[s.length >> 1];
}

/* ── 主循环 ─────────────────────── */
const HOLD_MS = 700;         // 信号丢失后的保持时间
function loop(){
  requestAnimationFrame(loop);
  analyser.getFloatTimeDomainData(buf);
  const { rms, freq } = autoCorrelate(buf, audioCtx.sampleRate);

  lvlBar.style.width = Math.min(100, rms * 900) + "%";
  const now = performance.now();
  const silence = now - lastSignal > HOLD_MS;

  if (freq > 0){
    lastSignal = now;
    acceptFreq(freq);
  } else if (silence){
    hist = [];
    devCount = 0;
    smoothCents = null;
    dispFreq = null;
    tunedLock = false;
    autoCand = null;
  }

  if (hist.length >= 3){
    const f = median(hist);
    let idx = activeIdx;
    if (autoMode || idx < 0){
      let bestC = Infinity, bestI = -1;
      STRINGS.forEach((s, i) => {
        const c = 1200 * Math.log2(f / s.hz);
        if (Math.abs(c) < Math.abs(bestC)){ bestC = c; bestI = i; }
      });
      /* 候选弦需连续 4 帧才切换，防止识别在相邻弦间抖动 */
      if (bestI !== activeIdx){
        autoCand = (autoCand && autoCand.i === bestI)
          ? { i: bestI, n: autoCand.n + 1 } : { i: bestI, n: 1 };
        if (autoCand.n >= 4) setActive(bestI);
      } else {
        autoCand = null;
      }
      idx = activeIdx;
    }
    if (idx >= 0) render(f, 1200 * Math.log2(f / STRINGS[idx].hz));
  } else if (!silence){
    /* 信号短暂丢失：保持当前显示，不闪烁复位 */
  } else {
    idle();
  }
}

/* ── 渲染：自适应平滑 + 吸附锁定 ───────── */
function render(f, cents){
  /* 偏差大 → 快速跟上；接近目标 → 缓慢细腻收敛 */
  if (smoothCents === null){
    smoothCents = cents;
  } else {
    const diff = cents - smoothCents;
    const a = Math.abs(diff) > 20 ? 0.5
            : Math.abs(diff) > 6  ? 0.22
            : 0.1;
    smoothCents += diff * a;
  }

  /* 吸附区带迟滞：±3¢ 内锁定为"准"，需偏出 ±6¢ 才解锁，消除边缘闪烁 */
  tunedLock = tunedLock ? Math.abs(cents) <= 6 : Math.abs(cents) <= OK_CENTS;
  const shown = Math.max(-RANGE, Math.min(RANGE, tunedLock ? 0 : smoothCents));
  markerEl.style.left = (50 + shown / RANGE * 50) + "%";

  bubbleEl.textContent = tunedLock ? "0"
    : (smoothCents > 0 ? "+" : "") + Math.round(smoothCents);
  bubbleEl.classList.toggle("ok", tunedLock);

  dispFreq = dispFreq === null ? f : dispFreq + (f - dispFreq) * 0.2;
  freqVal.textContent = dispFreq.toFixed(1);
  freqBox.classList.toggle("ok", tunedLock);

  statusEl.className = "status " + (tunedLock ? "ok" : cents < 0 ? "low" : "high");
  statusEl.textContent = tunedLock ? "✓ 准了"
    : cents < -OK_CENTS ? "偏低 · 拧紧琴钮"
    : "偏高 · 放松琴钮";
}

function idle(){
  markerEl.style.left = "50%";
  bubbleEl.textContent = "–";
  bubbleEl.classList.remove("ok");
  freqVal.textContent = "--";
  freqBox.classList.remove("ok");
  statusEl.className = "status";
  statusEl.textContent = activeIdx >= 0 ? "拨响选定的琴弦" : "拨响任意一根弦";
}
</script>
</body>
